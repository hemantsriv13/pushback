name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Regression gate against the offline mock. Real-model runs need secrets.
      - run: pushback run --model mock:robust --fail-under 1.0 --quiet
